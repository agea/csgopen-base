// Eclipse Recoil dedicated-server rotation. The first map comes from this list.
sv_defaultmap ""
sv_mainmaps "de_bank de_lake de_safehouse de_dust2 echo dutility"
sv_rotatemaps 2
sv_rotatemapsfilter 0
sv_mapsfilter 0
sv_maphistory 1
sv_rotatemode 0
sv_rotatemuts 0

// Players may vote for maps in the rotation, without changing TDM rules.
sv_mapslock 3
sv_mapslocktype 2
sv_votelock 3
sv_votelocktype 2
sv_votestyle 0
sv_voteinterm 1
sv_votethreshold 0.5
sv_timelimit 10
sv_pointlimit 0
sv_overtimeallow 0
sv_intermlimit 10000
sv_votelimit 20000

// Complete ZIP packages are served by the native HTTP server.
sv_mappackages 1
sv_mappackagedir "data/csgopen"
sv_waitforplayerload 120000
sv_waitforplayermaps 120000
sv_savevars
